version: '3'
services:
  maplestory:
    build: .
    # Come back after a host reboot or a crash, but stay down if stopped deliberately
    # (docker compose stop/down). Only takes effect if Docker Desktop itself starts on sign-in.
    restart: unless-stopped
    depends_on:
      - db
    ports:
      # Login server
      - "8484:8484"
      # Channels.
      # Format: WWCC, where WW is 75 plus the world number and CC is 75 plus the channel number (both zero indexed).
      # In this case, world 1 channels 1-3.
      - "7575-7577:7575-7577"
    volumes:
      # Config changes can be reloaded without rebuilding the image.
      # Still requires a redeployment as they're sourced on startup.
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
      # The OKF bundles live in the repo, not the image: BOT_MEMORY_DIR and BOT_KNOWLEDGE_DIR are
      # relative to the server directory, so without these mounts planning reads no corpus and every
      # resident's episode or acquaintance write lands in container storage and dies with it.
      - ../bot-memory:/opt/server/bot-memory
      - ../bot-knowledge:/opt/server/bot-knowledge:ro
    # The OpenRouter key. env_file rather than -e: the key must never appear in this file or the image.
    # It lives outside the repo deliberately (see CLAUDE.md) and must never be committed.
    env_file:
      - ../bot.env
    environment:
      DB_HOST: "db" ## Remember if this is present it will OVERRIDE the host in the config.yaml, if you put here anything other than db, you'll need to change the config.yaml jdbc string to port 3307, and not port 3306
    
  db:
    image: mysql:8.4.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - "127.0.0.1:3307:3306"  # local tools only; never expose the passwordless root account
    volumes:
      - ./database/docker-db-data:/var/lib/mysql
